<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Bento Box — Wireframe Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bento-container">

        <div class="bento-item sekat-1">
            <span class="bento-label">Sekat 1: Gohan (Main Rice)</span>
            <img src="src/images (1).jpeg" alt="Sekat 1 - Gohan / Main Rice">
        </div>

        <div class="bento-item sekat-2">
            <span class="bento-label">Sekat 2: Side Skewer</span>
            <img src="src/images.jpeg" alt="Sekat 2 - Side Skewer / Tall Dish">
        </div>

        <div class="bento-item sekat-3">
            <span class="bento-label">Sekat 3: Main Protein (Okazu)</span>
            <img src="src/images (2).jpeg" alt="Sekat 3 - Main Protein / Okazu">
        </div>

        <div class="bento-item sekat-4">
            <span class="bento-label">Sekat 4: Tsukemono &amp; Dessert</span>
            <img src="src/images (3).jpeg" alt="Sekat 4 - Tsukemono & Dessert">
        </div>

    </div>

</body>
</html>
